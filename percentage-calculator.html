<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Percentage Calculator — Tarexa</title>

  <meta name="description" content="Free percentage calculator by Tarexa. Calculate percentages, percentage increase, decrease and difference quickly and easily.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="HKtareen">
  <meta name="theme-color" content="#0b1020">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(108,99,255,.18), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,212,255,.12), transparent 28%),
        #070b16;
      color: #f5f7ff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(7,11,22,.78);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg,#766cff,#4e8cff);
      box-shadow: 0 8px 30px rgba(108,99,255,.35);
    }

    nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    nav a {
      color: #aeb5ca;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .nav-btn {
      padding: 11px 17px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
    }

    /* MAIN */

    main {
      padding: 65px 0 80px;
    }

    .breadcrumb {
      color: #858ea3;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .breadcrumb a {
      color: #a9a3ff;
    }

    .tool-header {
      text-align: center;
      margin-bottom: 38px;
    }

    .tool-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(108,99,255,.14);
      border: 1px solid rgba(108,99,255,.25);
      font-size: 32px;
      box-shadow: 0 15px 45px rgba(108,99,255,.12);
    }

    .tool-header h1 {
      font-size: clamp(34px, 6vw, 54px);
      letter-spacing: -2px;
      margin-bottom: 14px;
    }

    .gradient-text {
      background: linear-gradient(90deg,#8d82ff,#52c9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tool-header p {
      max-width: 650px;
      margin: auto;
      color: #9da6ba;
      line-height: 1.7;
      font-size: 16px;
    }

    /* CALCULATOR */

    .calculator-wrapper {
      max-width: 850px;
      margin: auto;
      display: grid;
      gap: 20px;
    }

    .calculator-card {
      padding: 30px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .calculator-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .calculator-card .description {
      color: #858ea3;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      color: #c5cad8;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 15px 17px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.11);
      outline: none;
      background: rgba(255,255,255,.055);
      color: white;
      font-size: 16px;
      transition: .2s;
    }

    .input-group input:focus {
      border-color: rgba(120,110,255,.7);
      box-shadow: 0 0 0 3px rgba(108,99,255,.08);
    }

    .calculate-btn {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg,#766cff,#4e8cff);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(108,99,255,.25);
      transition: .2s;
    }

    .calculate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(108,99,255,.35);
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 22px;
      border-radius: 17px;
      background: rgba(108,99,255,.09);
      border: 1px solid rgba(108,99,255,.2);
      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #929bb0;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .result-value {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg,#9b91ff,#5ed1ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .error {
      display: none;
      color: #ff8e9c;
      font-size: 14px;
      margin-top: 14px;
      text-align: center;
    }

    /* INFO */

    .info-box {
      max-width: 850px;
      margin: 30px auto 0;
      padding: 30px;
      border-radius: 22px;
      background: linear-gradient(135deg,
        rgba(108,99,255,.12),
        rgba(54,190,255,.06));
      border: 1px solid rgba(255,255,255,.09);
      line-height: 1.8;
    }
